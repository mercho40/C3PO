  <ellipse cx="32" cy="32" rx="11" ry="27" transform="rotate(32 32 32)" stroke="#7EE5FF" stroke-width="2.5" stroke-opacity="0.5"/>
  <circle cx="32" cy="34" r="8.5" fill="#7EE5FF"/>
</svg>
