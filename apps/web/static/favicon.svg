<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>C3PO</title>
  <!-- Simplified from logo.svg: the ring, one tilted orbit of the morphing
       ellipse sequence, and the glowing core — legible at 16px. -->
