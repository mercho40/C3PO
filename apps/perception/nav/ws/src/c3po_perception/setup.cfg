# WITHOUT THIS FILE THE PACKAGE BUILDS CLEANLY AND CANNOT BE LAUNCHED.
#
# setuptools puts console_scripts in `<prefix>/bin/`. ros2 launch and ros2 run
# look for them in `<prefix>/lib/<package_name>/` — the "libexec" directory —
# and nowhere else. With no setup.cfg the entry points land in bin/, colcon
# reports success, `ros2 pkg list` shows the package, and the only symptom is at
# launch time:
#
#   package 'c3po_perception' found at '/opt/c3po/ws/install/c3po_perception',
#   but libexec directory '.../lib/c3po_perception' does not exist
#
# which names a directory rather than the missing file that would have created
# it. This is the standard ament_python boilerplate; it is boilerplate precisely
# because everyone hits it once.
#
# `$base` is expanded by setuptools to the install prefix, so this stays correct
# under colcon's isolated install layout without hardcoding a path.
[develop]
script_dir=$base/lib/c3po_perception

[install]
install_scripts=$base/lib/c3po_perception
