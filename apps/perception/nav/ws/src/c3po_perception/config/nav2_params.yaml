# C3PO — Nav2 (Humble 1.1.20) for the Unitree G1.
#
# Read with D2.1 open: Nav2 NEVER drives the robot. Every velocity here leaves
# on /c3po/cmd_vel (DDS rt/c3po/cmd_vel) on domain 42, and apps/bridge decides
# whether it reaches the legs. The clamps below are ADVISORY — configuration can
# be wrong, so the enforcing clamp lives in the bridge, which is the actuation
# chokepoint and stays up while this container is being rebuilt.
#
# Frames (see c3po_perception/g1_odom_tf.py):
#   odom -> camera_init      static, roll=pi, z=lidar height  (un-inverts the mount)
#   camera_init -> body      FAST-LIO2's own broadcaster
#   body -> base_link        static, roll=pi + mount offset
#   odom -> base_footprint   g1_odom_tf, yaw only, z=0        (the FLAT costmap frame)
#
# No map frame and no AMCL: everything runs in `odom`. FAST-LIO's world frame IS
# an odometry frame — continuous, no loop closure, slow drift — which is exactly
# what Nav2 means by odom. Over tens of metres its drift is well below the
# costmap resolution. A map server and a map->odom publisher are a pure addition
# later; the seam does not change.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: "odom"          # g1_odom_tf's republish, NOT FAST-LIO's /Odometry
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.5
    publish_zero_velocity: true
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # These two numbers decide how long Nav2 argues with a bridge that is
      # refusing before it gives up. This IS the belief-resync mechanism: on a
      # veto the robot does not move, odom says so, and the goal fails honestly
      # instead of hanging. 0.25 m in 12 s is slow enough for a legitimately
      # slow biped.
      required_movement_radius: 0.25
      movement_time_allowance: 12.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    # DWB, NOT MPPI. nav2_mppi_controller's "50+ Hz" is measured on a 4th-gen
    # Intel i5 and its hot loop relies on AVX2/MFMA; Humble's CMakeLists gates
    # those behind check_cxx_compiler_flag("-mavx2"/"-mfma"), all of which fail
    # on aarch64, so xsimd falls back to 128-bit NEON. Worse, the Humble arm64
    # deb has an OPEN SIGILL in NoiseGenerator::generateNoisedControls
    # (navigation2#5061) — the node dies on activation with a trace that reads
    # like a config error. Revisit MPPI only after a standalone benchmark, and
    # if adopted, set model_dt to the ACHIEVED period, not the target.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Phase 1 is diff-drive only. The G1's SET_VELOCITY (7105) does take vy,
      # but strafing is the least-tested gait on this robot and nothing has yet
      # executed a non-zero SET_VELOCITY on it at all. To enable later:
      # vy_samples: 5, max_vel_y: 0.15, min_vel_y: -0.15.
      min_vel_x: 0.0            # no reversing: the G1 has no rear-facing sensing
      max_vel_x: 0.35
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.40
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      # A biped changes speed in whole gait cycles. 0.4 m/s^2 reaches 0.35 m/s
      # in ~0.9 s, roughly two steps. A step change in commanded velocity is
      # what makes the whole-body controller lurch.
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 0.6
      decel_lim_x: -0.6
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint     # the FLAT frame — see the header
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # G1 is 1320 x 450 x 200 mm standing, so the body's circumscribed radius
      # is sqrt(0.225^2 + 0.10^2) = 0.246 m. 0.35 m adds foot-swing and
      # arm-swing excursion. The binding constraint is not the body, it is
      # doorways: 0.70 m swept width clears a standard 0.80 m door with 50 mm
      # each side. At 0.40 m the robot cannot leave the room, and the failure
      # looks like a planner bug rather than a footprint choice.
      robot_radius: 0.35
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # The Mid-360 sees the robot's own arms and shoulders. Clearing the
        # footprint every cycle is what stops the G1 boxing itself in.
        footprint_clearing_enabled: true
        observation_sources: scan cloud
        scan:
          # 2D projection with the ground already removed. THIS source does the
          # CLEARING. A PointCloud2 source cannot raytrace free space once the
          # ground points are filtered out of the ObservationBuffer — the height
          # filter runs in bufferCloud() BEFORE the layer sees the cloud, so
          # ground-plane filtering also deletes the rays that would have cleared
          # free floor. Mark-only costmaps accumulate ghosts until the robot
          # boxes itself in.
          topic: /scan
          data_type: "LaserScan"
          sensor_frame: base_footprint
          marking: true
          clearing: true
          inf_is_valid: true          # empty bearing -> free out to range_max
          obstacle_max_range: 8.0
          obstacle_min_range: 0.45    # inside this it is the robot's own limbs
          raytrace_max_range: 10.0
          raytrace_min_range: 0.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
        cloud:
          # Marking-only second look at the deskewed body-frame cloud. The
          # Mid-360 is non-repetitive: one 100 ms frame can miss a chair leg the
          # 2D projection then never sees. 0.4 s stacks ~4 frames.
          topic: /cloud_registered_body
          data_type: "PointCloud2"
          sensor_frame: livox_frame   # the raytrace ORIGIN, not the cloud frame
          marking: true
          clearing: false
          min_obstacle_height: 0.08   # metres above the floor, IN `odom`
          max_obstacle_height: 1.45   # robot is 1.32 m; a 2 m lintel is not an obstacle
          obstacle_max_range: 6.0
          obstacle_min_range: 0.45
          expected_update_rate: 0.5
          observation_persistence: 0.4
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.70
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom               # no map frame, no AMCL
      robot_base_frame: base_footprint
      rolling_window: true             # unmapped space: the world is a 24 m window
      width: 24
      height: 24
      resolution: 0.10                 # coarser than local, on purpose (Orin NX)
      robot_radius: 0.35
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          sensor_frame: base_footprint
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 10.0
          obstacle_min_range: 0.45
          raytrace_max_range: 12.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.70
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.30
      use_astar: true
      allow_unknown: true              # unmapped space is the normal case here

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # ONLY `wait`. nav2_behaviors' BackUp, Spin and DriveOnHeading are written
    # for a wheeled base; an autonomous spin-in-place on a biped, triggered by a
    # costmap glitch, is a fall. Re-add them one at a time, deliberately, after
    # the first supervised window.
    #
    # And note: nav2_bringup's navigation_launch.py does NOT remap
    # behavior_server, which publishes on a bare "cmd_vel" from
    # nav2_behaviors' TimedBehavior base class. Our launch file remaps it
    # explicitly, or Spin/BackUp would bypass the smoother entirely and publish
    # where nothing listens — the robot "refuses to recover" with no error.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom                 # not "map": there is no map frame
    robot_base_frame: base_footprint
    odom_topic: "odom"
    bt_loop_duration: 10
    default_server_timeout: 20
    # THE FULL UPSTREAM LIST, and trimming it is a trap we already fell into.
    #
    # This was cut to nine entries on the reasoning that we only enable `wait`
    # among the recovery behaviours, so the rest were dead weight. That confuses
    # two different things: which behaviours the BT *uses* at runtime, and which
    # BT nodes must be REGISTERED before the XML will parse at all.
    #
    # bt_navigator loads default_nav_to_pose_bt_xml AND
    # default_nav_through_poses_bt_xml. Neither is set here, so both come from
    # nav2_bringup — and navigate_through_poses_w_replanning_and_recovery.xml
    # references RemovePassedGoals on line 12. One unregistered node fails the
    # whole parse:
    #
    #   Exception when loading BT: Node not recognized: RemovePassedGoals
    #   Failed to bring up all requested nodes. Aborting bringup.
    #
    # And it aborts the SEQUENCE, so velocity_smoother — the node that owns the
    # only path to /c3po/cmd_vel — never activated either. A trimmed list buys
    # nothing but load time and costs the whole bringup.
    #
    # Copied verbatim from this image's own
    # /opt/ros/humble/share/nav2_bringup/params/nav2_params.yaml, so it matches
    # the exact Nav2 build we ship rather than a version from the internet. If a
    # future BT references something new, take the list from there again.
    # PIN BOTH TREES. bt_navigator loads default_nav_to_pose_bt_xml AND
    # default_nav_through_poses_bt_xml at activation, and resolves every action
    # server they name at LOAD time — not at first use. Leaving either on the
    # upstream default fails the whole bringup with
    #   Exception when loading BT: Action server spin not available
    # because behavior_plugins is ["wait"] on purpose: a spin-in-place on a
    # biped, triggered by a costmap glitch, is a fall. These two trees are the
    # upstream ones with Spin and BackUp removed from the recovery round-robin
    # and nothing else changed. See their headers.
    # The two BT paths are NOT set here. `$(find-pkg-share ...)` is LAUNCH-FILE
    # substitution syntax; a plain YAML parameter value is passed through
    # literally, so bt_navigator received the dollar-sign string and reported
    #   Couldn't open input XML file: $(find-pkg-share c3po_perception)/...
    # nav2.launch.py sets both by absolute path via PathJoinSubstitution, the
    # same way it already resolves nav2_params.yaml and MID360_config.json.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    # OPEN_LOOP, and this is the corrected value. The README is explicit: "Do
    # not exceed the smoothing frequency to your odometry frequency in closed
    # loop mode... the robot can oscillate and/or accelerate slowly due to
    # latency in closed loop mode." Our odometry is LiDAR-scan-rate (~10 Hz)
    # against a 20 Hz smoother — precisely the named failure. Belief re-sync on
    # a bridge veto comes from SimpleProgressChecker on /odom instead.
    feedback: "OPEN_LOOP"
    odom_topic: "odom"
    odom_duration: 0.1
    velocity_timeout: 1.0              # matches the firmware's 1 s SET_VELOCITY deadman
    max_velocity: [0.35, 0.0, 0.40]
    min_velocity: [0.0, 0.0, -0.40]
    max_accel: [0.40, 0.0, 0.60]
    max_decel: [-0.60, 0.0, -1.00]
    deadband_velocity: [0.05, 0.0, 0.10]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    # FALSE, and do not change it. autostart:true brings bt_navigator to ACTIVE
    # the instant the container starts, and from that moment any participant on
    # domain 42 that sends a NavigateToPose goal produces velocity commands.
    # Container start must never be the same event as "the robot is ready to be
    # driven" — the same reasoning as the boot unit running C3PO_NO_TAKEOVER=1.
    autostart: false
    # 4.0 s is the Nav2 default and it kills nodes on a loaded Orin NX during
    # costmap allocation: they get respawned in a loop and it reads as a crash.
    bond_timeout: 20.0
    bond_respawn_max_duration: 20.0
    attempt_respawn_reconnection: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother
