name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript — type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - run: bun install --frozen-lockfile

      # THIS JOB FAILED ON EVERY RUN UNTIL 2026-08-27, AND BOTH STEPS BELOW
      # ARE WHY.
      #
      # `.env` is gitignored, so a CI checkout has none, and both of the next
      # two steps read it:
      #
      #   * apps/web — `$env/static/public` is GENERATED by `svelte-kit sync`
      #     from the environment. With no `.env`, `PUBLIC_API_URL` and friends
      #     are not declared and svelte-check reports 106 errors across 9
      #     files. With one: 0 errors across 6401 files.
      #   * apps/back — `src/lib/env.ts` THROWS at import time when
      #     DATABASE_URL / WEB_URL / BETTER_AUTH_URL / BETTER_AUTH_SECRET are
      #     missing, so the suite could not even load. With one: 54 pass.
      #
      # Derived from `.env.example` rather than written out here, deliberately.
      # A hardcoded list in this file is a third place that has to agree with
      # the other two, and the last time two places had to agree about
      # configuration one of them moved and the headset lost its camera. This
      # way, adding a required variable to `env.ts` without documenting it in
      # `.env.example` fails CI — which is exactly the check you want.
      #
      # Values are the example's own placeholders and are NOT secrets: nothing
      # here reaches a network. BETTER_AUTH_SECRET is appended because the
      # example ships it blank (it is a "generate your own" field) and
      # `env.ts` requires it to be non-empty.
      - name: Seed .env from .env.example (CI has no secrets, and needs none)
        run: |
          cp apps/web/.env.example apps/web/.env
          cp apps/back/.env.example apps/back/.env
          echo 'BETTER_AUTH_SECRET=ci-placeholder-not-a-secret-0000000000' \
            >> apps/back/.env

      # `bun run check-types` fans out to every workspace via turbo, including
      # the two PYTHON ones. @repo/bridge's mypy needs `uv` + CycloneDDS and
      # @repo/perception's needs `uv`; neither toolchain is set up in this job.
      # Both run their own type check in the jobs below that do have it, so
      # filter them out here rather than duplicating the setup twice.
      - run: >
          bun run check-types --
          --filter='!@repo/bridge' --filter='!@repo/perception'

      - name: apps/back unit tests
        working-directory: apps/back
        run: bun test

      # THE HEADSET'S TESTS WERE NOT RUN BY ANYTHING UNTIL 2026-08-27.
      #
      # 210 of them: the camera layer's silent-black failure modes, the menu
      # and radar placement, the per-eye stereo geometry, the teleop protocol,
      # the MJPEG liveness logic. Every one of them guards something that has
      # already gone wrong in a real session with somebody wearing the thing,
      # and none of them could fail the build.
      #
      # `bun test` in apps/back was added and apps/web was not — the whole
      # suite is one line, needs no services, and takes ~18 s.
      - name: apps/web unit tests
        working-directory: apps/web
        run: bun test

      # The note that used to live here said `prettier --check` failed on ~122
      # files, mostly vendored shadcn-svelte components, and that gating it
      # would mean reformatting a lot of unrelated code. That was true when it
      # was written and is not any more: measured on 2026-08-27, the repo is
      # prettier-clean apart from files this branch itself touched.
      #
      # What was actually left were three files a TOOL wrote —
      # `.pytest_cache/README.md` in two apps and a dist-info SBOM inside
      # `apps/perception/.venv`. Both trees are gitignored, so CI never saw
      # them; only somebody running `bun run format` after the test suite did,
      # and it made the command look permanently broken. They are in
      # `.prettierignore` now, which is what let this become a gate.
      - name: Formatting
        run: bunx prettier --check "**/*.{ts,tsx,svelte,json,md}"

  perception:
    name: Perception — lint, Stage 0 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      # NO ROBOT, NO ROS, NO DDS, NO CUDA, NO CAMERA — BY DESIGN, AND THAT IS
      # PRECISELY WHY THIS BELONGS IN CI.
      #
      # `apps/perception/tests` is the Stage 0 harness: 221 tests that run on a
      # laptop in under half a second, declaring no dependency beyond pytest.
      # Keeping them runnable without hardware is a stated design constraint of
      # that package (see its pyproject header) — and nothing was enforcing it,
      # because nothing ran them. They cover the costmap PNG encoder, the
      # scan-ring contract crossing domain 42, the grounding maths, and the
      # `fake` stage that Stage 3 depends on being genuinely exercisable.
      #
      # A suite this cheap that guards a boundary this expensive to debug on
      # hardware is the single best value-per-second in the repo.
      - name: Stage 0 tests
        working-directory: apps/perception
        run: uv run --project . pytest -q

      # THE PYTHON 3.8 SYNTAX FLOOR IS LOAD-BEARING.
      #
      # `vision/c3po_vision` is COPIED into an l4t-jetpack:r35.3.1 image whose
      # interpreter is pinned to 3.8 by TensorRT's own packaging
      # (`python3-libnvinfer` hard-depends `python3 (>= 3.8), python3 (<< 3.9)`).
      # The harness above runs it under 3.12, where 3.9+ syntax is perfectly
      # valid — so a `dict[str, int]` annotation added here passes every test on
      # the laptop and then fails at container start on the robot, which is the
      # most expensive place in this project to discover a syntax error.
      #
      # ruff's target-version is what catches that, and it was configured and
      # never run.
      - name: ruff (py38 floor for the vision container)
        working-directory: apps/perception
        run: uv run --project . ruff check .

      # A DIFFERENT CHECK FROM THE ONE ABOVE, and both are needed.
      #
      # ruff enforces the 3.8 SYNTAX floor — the failure that breaks a
      # container at start. mypy cannot: current mypy refuses
      # `--python-version 3.8` outright. So it runs at 3.10 and does the
      # orthogonal job, finding type errors. On its first run it found the
      # TensorRT binding dicts being indexed with `int | None` four times in
      # the inference hot loop, and `source.intrinsics` (Optional until
      # `start()` fills it) being passed into the grounding maths on every
      # tick — where a missing stream profile would have failed deep inside
      # the deprojection and been reported as an inference failure.
      #
      # Source trees only, like apps/bridge's `mypy src`.
      - name: mypy
        working-directory: apps/perception
        run: uv run --project . mypy vision bringup nav

  bridge:
    name: Bridge — lint, type-check, pytest
    runs-on: ubuntu-latest
    env:
      CYCLONEDDS_HOME: ${{ github.workspace }}/.cyclonedds-0.10.2
    steps:
      - uses: actions/checkout@v4

      # unitree_sdk2py -> cyclonedds (Python bindings) builds against this C
      # library at `uv sync` time. No apt/prebuilt package for it — build from
      # source, same steps apps/bridge/README.md documents for macOS. Cached
      # by version so this only actually compiles on a cache miss.
      - name: Cache CycloneDDS C library
        id: cyclonedds-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CYCLONEDDS_HOME }}
          key: cyclonedds-0.10.2-${{ runner.os }}-v1

      - name: Build CycloneDDS C library
        if: steps.cyclonedds-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.10.2 https://github.com/eclipse-cyclonedds/cyclonedds.git /tmp/cyclonedds-src
          cmake -S /tmp/cyclonedds-src -B /tmp/cyclonedds-build \
            -DCMAKE_INSTALL_PREFIX="$CYCLONEDDS_HOME" \
            -DBUILD_IDLC=ON -DBUILD_TESTING=OFF -DBUILD_DDSPERF=OFF \
            -DENABLE_SECURITY=NO -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/cyclonedds-build --target install -j "$(nproc)"

      - uses: astral-sh/setup-uv@v4

      - name: Install bridge deps
        working-directory: apps/bridge
        run: uv sync --group dev

      - name: Apply unitree_sdk2py patch
        working-directory: apps/bridge
        run: ./scripts/postsync.sh

      # `scripts` included as of 2026-08-27. Everything in there was already
      # clean, so this costs nothing today — and those are the files somebody
      # runs while STANDING NEXT TO A HUMANOID holding an e-stop
      # (`vr_smoke_test.py`, `measure_turn.py`, `headset_check.py`). An
      # unbound name in one of those surfaces at the worst possible moment.
      - name: ruff
        working-directory: apps/bridge
        run: uv run ruff check src tests scripts

      # `scripts` too, for the same reason ruff covers it: those are the files
      # somebody runs standing next to a humanoid with an e-stop in their hand.
      # It found two real typing faults in `arm_sign_check.py` the first time
      # it ran — a driver variable holding two incompatible types on what
      # looked like one path, in the script that MOVES THE ARMS.
      - name: mypy
        working-directory: apps/bridge
        run: uv run mypy src scripts

      - name: pytest
        working-directory: apps/bridge
        run: uv run pytest -v
