name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript and shell — checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - run: bun install --frozen-lockfile

      # `bun run check-types` fans out to every workspace via turbo,
      # including @repo/bridge (Python) -- its mypy check needs `uv` +
      # CycloneDDS, which this job doesn't set up (that toolchain lives in
      # the `bridge` job below, where its own lint/type-check step runs
      # instead). Filter it out here rather than duplicate that setup.
      - run: bun run check-types -- --filter='!@repo/bridge'

      # The shell suite runs shellcheck when available. Install it explicitly so
      # CI never reports a skipped static-analysis gate as a pass.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Keep package tests behind Turbo so local and CI task selection use the
      # same package boundaries and cache keys.
      - name: back, web, and robot-script tests
        run: bun run test -- --filter=@repo/back --filter=@repo/web --filter=@repo/robot-scripts

      # NOTE: `bunx prettier --check` currently fails on ~122 files (mostly
      # vendored shadcn-svelte components, not hand-written code) — the repo
      # predates this CI and was never prettier-clean. Deliberately not gated
      # here: reformatting that much unrelated code as a side effect of adding
      # CI isn't this workflow's call to make. Run `bun run format` repo-wide
      # and re-add this step once that's done intentionally.

  perception:
    name: Perception — lint and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install perception test harness
        working-directory: apps/perception
        run: uv sync --frozen --group dev

      - name: ruff
        working-directory: apps/perception
        run: uv run ruff check .

      - name: pytest
        working-directory: apps/perception
        run: uv run pytest -v

  bridge:
    name: Bridge — lint, type-check, pytest
    runs-on: ubuntu-latest
    env:
      CYCLONEDDS_HOME: ${{ github.workspace }}/.cyclonedds-0.10.2
    steps:
      - uses: actions/checkout@v4

      # unitree_sdk2py -> cyclonedds (Python bindings) builds against this C
      # library at `uv sync` time. No apt/prebuilt package for it — build from
      # source, same steps apps/bridge/README.md documents for macOS. Cached
      # by version so this only actually compiles on a cache miss.
      - name: Cache CycloneDDS C library
        id: cyclonedds-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CYCLONEDDS_HOME }}
          key: cyclonedds-0.10.2-${{ runner.os }}-v1

      - name: Build CycloneDDS C library
        if: steps.cyclonedds-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 0.10.2 https://github.com/eclipse-cyclonedds/cyclonedds.git /tmp/cyclonedds-src
          cmake -S /tmp/cyclonedds-src -B /tmp/cyclonedds-build \
            -DCMAKE_INSTALL_PREFIX="$CYCLONEDDS_HOME" \
            -DBUILD_IDLC=ON -DBUILD_TESTING=OFF -DBUILD_DDSPERF=OFF \
            -DENABLE_SECURITY=NO -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/cyclonedds-build --target install -j "$(nproc)"

      - uses: astral-sh/setup-uv@v4

      - name: Install bridge deps
        working-directory: apps/bridge
        run: uv sync --frozen --group dev

      - name: Apply unitree_sdk2py patch
        working-directory: apps/bridge
        run: ./scripts/postsync.sh

      - name: ruff
        working-directory: apps/bridge
        run: uv run ruff check src tests

      - name: mypy
        working-directory: apps/bridge
        run: uv run mypy src

      - name: pytest
        working-directory: apps/bridge
        run: uv run pytest -v
